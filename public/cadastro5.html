<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <nav class="menu">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="galeria.html">Galeria</a>
        <a class="link" href="chat.html">Chat</a>
        <a class="link" id="linkCadastro" href="cadastro5.html">Cadastro</a>
        <a class="link" href="login5.html">Login</a>
        <button type="button" id="btnLogout" class="link link-logout" hidden>Log-out</button>
    </nav>

    <div class="conteiner-cadastro">
        <div class="conteiner-ch1">
            <h2>Cadastro</h2><br>
        </div>

        <div class="cadastro-envio">
            <label for="cadUsuario">Nome de usuario</label><br>
            <input type="text" id="cadUsuario" placeholder="Digite seu nome" required><br><br>

            <label for="cadEmail">email</label><br>
            <input type="email" id="cadEmail" placeholder="Digite seu email" required><br><br>

            <label for="cadSenha">senha</label><br>
            <input type="password" id="cadSenha" placeholder="Digite sua senha" required><br><br>

            <button id="btnCadastro" class="card">Enviar</button>
            <div id="cadMensagem" class="mensagem-servidor"></div>
        </div>
    </div>

    <div id="modalPosCadastro" class="auth-overlay" hidden>
        <div class="auth-modal">
            <div class="auth-modal-icon">✓</div>
            <h2 class="auth-modal-titulo">Cadastro concluído!</h2>
            <p class="auth-modal-texto">
                Sua conta foi criada com sucesso.<br>
                Agora faça login para acessar o chat.
            </p>
            <div class="auth-modal-botoes">
                <a href="login5.html" class="auth-btn auth-btn-primario">Ir para Login</a>
                <a href="index.html" class="auth-btn auth-btn-secundario">Voltar ao Home</a>
            </div>
        </div>
    </div>

    <footer>
        <p>©Desenvolvido por Josiel Pereira Filho</p>
    </footer>

    <script>
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        const linkCadastro = document.querySelector('#linkCadastro');
        const btnLogout = document.querySelector('#btnLogout');

        if (usuarioLogado) {
            linkCadastro.hidden = true;
            btnLogout.hidden = false;
        } else {
            linkCadastro.hidden = false;
            btnLogout.hidden = true;
        }

        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('usuarioLogado');
            localStorage.removeItem('emailLogado');
            window.location.href = 'index.html';
        });

        const btnCadastro = document.querySelector('#btnCadastro');
        const cadMensagem = document.querySelector('#cadMensagem');
        const modalPosCadastro = document.querySelector('#modalPosCadastro');

        btnCadastro.addEventListener('click', async () => {
            const usuarioEntrada = document.querySelector('#cadUsuario');
            const emailEntrada = document.querySelector('#cadEmail');
            const senhaEntrada = document.querySelector('#cadSenha');

            const usuario = usuarioEntrada.value.trim();
            const email = emailEntrada.value.trim();
            const senha = senhaEntrada.value;

            if (!usuario || !email || !senha) {
                cadMensagem.textContent = 'Preencha todos os campos antes de enviar!';
                cadMensagem.className = 'mensagem-servidor msg-erro';
                return;
            }

            cadMensagem.textContent = 'Dados enviados, aguarde 5 segundos...';
            cadMensagem.className = 'mensagem-servidor msg-aguardando';
            btnCadastro.disabled = true;

            try {
                const respostaBE = await fetch('http://localhost:5500/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario: usuario,
                        email: email,
                        senha: senha
                    })
                });

                const dados = await respostaBE.json();

                if (!respostaBE.ok) {
                    cadMensagem.textContent = dados.erro || 'Erro no cadastro';
                    cadMensagem.className = 'mensagem-servidor msg-erro';
                    btnCadastro.disabled = false;
                    return;
                }

                cadMensagem.textContent = `${dados.mensagem}: ${dados.perfil}`;
                cadMensagem.className = 'mensagem-servidor msg-sucesso';

                usuarioEntrada.value = '';
                emailEntrada.value = '';
                senhaEntrada.value = '';

                setTimeout(() => {
                    modalPosCadastro.hidden = false;
                }, 800);
            } catch (erro) {
                console.error('Erro na requisição:', erro);
                cadMensagem.textContent = 'Erro ao conectar com o servidor!!';
                cadMensagem.className = 'mensagem-servidor msg-erro';
            } finally {
                btnCadastro.disabled = false;
            }
        });
    </script>
</body>

</html>
